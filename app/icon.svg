<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Void background -->
  <rect width="32" height="32" rx="6" fill="#030508"/>

  <!-- Agent node graph mark -->
  <!-- Central node (employer) -->
  <circle cx="16" cy="13" r="4.5" fill="#9DFFB0"/>

  <!-- Connector lines to sub-nodes -->
  <line x1="16" y1="17.5" x2="8" y2="25" stroke="#9DFFB0" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="16" y1="17.5" x2="16" y2="25" stroke="#9DFFB0" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="16" y1="17.5" x2="24" y2="25" stroke="#9DFFB0" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Sub-nodes (agents) -->
  <circle cx="8" cy="25" r="2.2" fill="#9DFFB0" opacity="0.7"/>
  <circle cx="16" cy="25" r="2.2" fill="#9DFFB0" opacity="0.7"/>
  <circle cx="24" cy="25" r="2.2" fill="#9DFFB0" opacity="0.7"/>
</svg>
